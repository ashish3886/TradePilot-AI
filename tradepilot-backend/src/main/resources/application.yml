spring:
  application:
    name: tradepilot-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/tradepilot
    username: tradepilot
    password: tradepilot123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true


  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: tradepilot-market-data
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.tradepilot.market.event
        spring.json.value.default.type: com.tradepilot.market.event.MarketCandleEvent

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000



